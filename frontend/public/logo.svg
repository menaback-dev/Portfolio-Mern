<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 545 110" width="545" height="110" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;700&amp;display=swap');
      
      .brand-bold {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace;
        font-weight: 700;
        font-size: 100px;
        fill: #6fcf97;
        letter-spacing: -2px;
      }
      .brand-light {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace;
        font-weight: 300;
        font-size: 100px;
        fill: #f4f4f4;
        letter-spacing: -1px;
      }
      .brand-cursor {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace;
        font-weight: 700;
        font-size: 100px;
        fill: #6fcf97;
        letter-spacing: 0px;
      }
    </style>
  </defs>

  <!-- Wordmark with no space before the cursor -->
  <text x="0" y="82">
    <tspan class="brand-bold">Mena</tspan><tspan class="brand-light">.dev4</tspan><tspan class="brand-cursor">_</tspan>
  </text>
</svg>
